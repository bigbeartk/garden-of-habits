name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # App Android (Capacitor): cùng mã nguồn với PWA, đóng gói thành APK để tải về cài thử.
  # Không chặn deploy PWA: job này chạy song song, lỗi ở đây không ảnh hưởng GitHub Pages.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor CLI 8 cần Node >= 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - name: Giải mã khoá ký (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64: chỉ build APK debug (không cài đè được giữa các lần build). Xem docs/android.md"
          fi
      - name: Build APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          V="-PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}"
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon $V assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/garden-of-habits-${{ github.run_number }}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/garden-of-habits-${{ github.run_number }}.aab"
          else
            ./gradlew --no-daemon $V assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/garden-of-habits-${{ github.run_number }}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: garden-of-habits-android-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/garden-of-habits-*.apk
            ${{ runner.temp }}/garden-of-habits-*.aab
          retention-days: 90
